version: 1

# Champs optionnels par projet (non renseignés = comportement historique inchangé) :
#   origin: bootstrap|adopted   — bootstrap (défaut implicite) = initialisé greenfield via le mode BOOTSTRAP ;
#                                  adopted = inscrit dans le framework via le mode ADOPT (repo existant, brownfield).
#   adopted_at: <YYYY-MM-DD>   — date d'inscription, uniquement si origin: adopted.

defaults:
  owner: "fsapro"
  repository_visibility: private
  main_branch: main
  max_active_implementation_items: 1

projects:
  taas:
    name: taas
    description: "Framework ouvert de détection, jugement et action traçables"
    repository: fsapro/taas
    status: active
    origin: adopted
    adopted_at: 2026-07-25
    phases:
      - id: phase-0
        name: "Adoption"
        milestone: 0

  mcp-product-opportunity:
    name: mcp-product-opportunity
    description: "Repository de test MCP end-to-end pour VS Code et Copilot Agent"
    repository: fsapro/mcp-product-opportunity
    status: active
    started: 2026-07-17
    phases:
      - id: phase-1
        name: "Scaffold et configuration TypeScript"
        milestone: 1
      - id: phase-2
        name: "Outils MCP core"
        milestone: 2
      - id: phase-3
        name: "Validation, erreurs et logs"
        milestone: 3
      - id: phase-4
        name: "Tests automatises"
        milestone: 4
      - id: phase-5
        name: "Documentation et verification VS Code"
        milestone: 5

  agent-prequalification-opportunites:
    name: agent-prequalification-opportunites
    description: "Agent de préqualification IA des opportunités Notion — Power Automate + Copilot Studio + Teams"
    repository: fsapro/agent-prequalification-opportunites
    status: active
    started: 2026-07-15
    phases:
      - id: phase-1
        name: "Audit de l'existant"
        milestone: 1
      - id: phase-2
        name: "Prompt & Schéma de l'Agent Copilot Studio"
        milestone: 2
      - id: phase-3
        name: "Power Automate — Trigger & Appel Agent"
        milestone: 3
      - id: phase-4
        name: "Notification Teams avec Adaptive Card"
        milestone: 4
      - id: phase-5
        name: "Mise à jour Notion post-validation"
        milestone: 5
    resources:
      copilot_studio_agent: "https://copilotstudio.microsoft.com/environments/a39f8854-624f-e5e1-a440-b50fdd1c80fd/agents/e2d38b5f-5b1d-40ab-b7fd-35b30c9c0b36"
      power_automate_flow: "https://copilotstudio.microsoft.com/environments/a39f8854-624f-e5e1-a440-b50fdd1c80fd/flows/718a36c7-2695-d7df-6864-87001b73e415"
      notion_offer_catalog: "https://app.notion.com/p/39d36a1ef15881d3945bd2ea728f25e5"
      capabilities_collection: "collection://5f038ff0-62ca-40a3-9af2-c3b5dbdd7687"
      features_collection: "collection://d2888f7a-79b7-4017-b080-b1f670ed48f0"